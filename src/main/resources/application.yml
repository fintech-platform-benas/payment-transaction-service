spring:
  application:
    name: payment-transaction-service

  # ==================== DATABASE ====================
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for migrations
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ==================== FLYWAY ====================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # ==================== KAFKA ====================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      compression-type: snappy
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432

  # ==================== SPRING BATCH ====================
  batch:
    job:
      enabled: false  # No auto-ejecutar al arrancar (solo manual)
    jdbc:
      initialize-schema: always  # Crea tablas batch metadata

# ==================== SERVER ====================
server:
  port: 8082
  servlet:
    context-path: /

# ==================== MANAGEMENT ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    com.paymentchain: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==================== EXTERNAL SERVICES ====================
customer:
  service:
    url: http://localhost:8081

# ==================== WEBCLIENT ====================
webclient:
  connection-timeout: 5000
  read-timeout: 5000
  write-timeout: 5000
  response-timeout: 10000

# ==================== SPRINGDOC ====================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
